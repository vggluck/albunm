<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EchoZero | Звезда X Цены</title>
    <style>
        body { background-color: #000; color: #fff; font-family: 'Helvetica', Arial, sans-serif; display: flex; justify-content: center; padding: 20px; margin: 0; }
        .container { max-width: 450px; width: 100%; text-align: center; }
        .cover { width: 100%; border-radius: 15px; margin-bottom: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.8); }
        h1 { font-size: 26px; margin: 0; letter-spacing: 1px; }
        .artist { color: #888; margin-top: 5px; margin-bottom: 30px; font-weight: bold; text-transform: uppercase; font-size: 14px; }
        
        .list { background: #111; border-radius: 20px; overflow: hidden; border: 1px solid #222; }
        .item { display: flex; align-items: center; justify-content: space-between; padding: 15px 20px; border-bottom: 1px solid #222; }
        .item:last-child { border-bottom: none; }
        .platform { display: flex; align-items: center; gap: 15px; font-weight: 600; font-size: 16px; }
        .platform img { width: 28px; height: 28px; object-fit: contain; }
        
        .btn { background: #1a1a1a; color: #fff; text-decoration: none; padding: 10px 22px; border-radius: 8px; font-size: 13px; font-weight: bold; border: 1px solid #333; transition: 0.2s; }
        .btn:hover { background: #fff; color: #000; border-color: #fff; }
    </style>
</head>
<body>

<div class="container">
    <img src="1ioZY_rROS3RkN_370x370.jpeg" class="cover">
    <h1>Звезда X Цены</h1>
    <p class="artist">TailsGamer777, $onik play</p>

    <div class="list">
        <div class="item">
            <div class="platform">
                <img src="https://cdn.worldvectorlogo.com/logos/apple-music-icon.svg">
                <span>Apple Music</span>
            </div>
            <a href="https://music.apple.com/us/album/1881730670" class="btn">Слушать</a>
        </div>

        <div class="item">
            <div class="platform">
                <img src="https://cdn.worldvectorlogo.com/logos/youtube-music-1.svg">
                <span>YouTube Music</span>
            </div>
            <a href="https://music.youtube.com/watch?v=RSKn_1mIwOY" class="btn">Слушать</a>
        </div>

        <div class="item">
            <div class="platform">
                <img src="https://upload.wikimedia.org/wikipedia/commons/6/6a/Yandex_Music_logo_2023.svg">
                <span>Яндекс Музыка</span>
            </div>
            <a href="#" class="btn">Слушать</a>
        </div>

        <div class="item">
            <div class="platform">
                <img src="https://upload.wikimedia.org/wikipedia/commons/7/75/Deezer_logo%2C_2023.svg">
                <span>Deezer</span>
            </div>
            <a href="https://www.deezer.com/album/931038031" class="btn">Слушать</a>
        </div>

        <div class="item">
            <div class="platform">
                <img src="https://cdn.worldvectorlogo.com/logos/vk-1.svg">
                <span>VK Музыка</span>
            </div>
            <a href="#" class="btn">Слушать</a>
        </div>

        <div class="item">
            <div class="platform">
                <img src="https://upload.wikimedia.org/wikipedia/commons/b/b3/HiFi-streaming_Zvuk_logo.svg">
                <span>ЗВУК</span>
            </div>
            <a href="#" class="btn">Слушать</a>
        </div>
    </div>
</div>

</body>
</html>
