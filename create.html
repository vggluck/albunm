<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOXLINK | СОЗДАТЬ СМАРТЛИНК</title>
    <style>
        body { background: #fff; color: #000; font-family: sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        .editor { width: 40%; padding: 40px; border-right: 1px solid #eee; overflow-y: auto; box-sizing: border-box; }
        h2 { font-weight: 900; font-size: 28px; margin-bottom: 30px; text-transform: uppercase; }
        .field { margin-bottom: 20px; }
        label { display: block; font-weight: 700; margin-bottom: 8px; font-size: 14px; }
        input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #ddd; font-size: 16px; box-sizing: border-box; margin-bottom: 10px; }
        .btn-pub { background: #000; color: #fff; width: 100%; padding: 18px; border: none; border-radius: 12px; font-weight: 800; font-size: 18px; cursor: pointer; margin-top: 20px; }
        
        /* ПРЕВЬЮ */
        .preview { width: 60%; background: #f4f4f4; display: flex; align-items: center; justify-content: center; }
        .phone { width: 340px; height: 700px; background: #fff; border: 10px solid #000; border-radius: 40px; padding: 20px; overflow-y: auto; box-shadow: 0 20px 50px rgba(0,0,0,0.1); }
        .p-img { width: 100%; aspect-ratio: 1/1; border-radius: 15px; object-fit: cover; background: #eee; margin-bottom: 20px; }
        .p-title { font-weight: 800; font-size: 20px; text-align: center; margin: 0; }
        .p-artist { color: #888; text-align: center; font-size: 13px; text-transform: uppercase; margin: 5px 0 20px; }
        .p-list { background: #f9f9f9; border-radius: 12px; border: 1px solid #eee; }
        .p-item { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #eee; align-items: center; font-size: 14px; font-weight: 600; }
        .p-btn { background: #000; color: #fff; padding: 6px 12px; border-radius: 6px; font-size: 11px; }
    </style>
</head>
<body>

    <div class="editor">
        <h2>FOXLINK CREATE</h2>
        <div class="field">
            <label>ОБЛОЖКА</label>
            <input type="file" id="f-img" accept="image/*" onchange="loadImg(event)">
        </div>
        <div class="field">
            <label>АРТИСТ / ТРЕК</label>
            <input type="text" id="f-artist" placeholder="Артист" oninput="sync()">
            <input type="text" id="f-title" placeholder="Трек" oninput="sync()">
        </div>
        <div class="field">
            <label>URL (SLUG)</label>
            <input type="text" id="f-slug" placeholder="my-track-link" oninput="sync()">
        </div>
        <div class="field">
            <label>ССЫЛКИ</label>
            <input type="text" class="link-in" data-name="Apple Music" placeholder="Apple Music URL" oninput="sync()">
            <input type="text" class="link-in" data-name="Yandex Music" placeholder="Yandex Music URL" oninput="sync()">
            <input type="text" class="link-in" data-name="YouTube Music" placeholder="YouTube Music URL" oninput="sync()">
           <input type="text" class="link-in" data-name="Wink Music" placeholder="Wink Music URL" oninput="sync()">
           <input type="text" class="link-in" data-name="Yandex Music" placeholder="Yandex Music URL" oninput="sync()">
          <input type="text" class="link-in" data-name="VK Music" placeholder="VK Music URL" oninput="sync()">
        </div>
        <button class="btn-pub" onclick="publish()">ОПУБЛИКОВАТЬ</button>
    </div>

    <div class="preview">
        <div class="phone">
            <img id="p-img" src="" class="p-img">
            <p id="p-title" class="p-title">Название</p>
            <p id="p-artist" class="p-artist">АРТИСТ</p>
            <div id="p-list" class="p-list"></div>
        </div>
    </div>

    <script>
        function sync() {
            document.getElementById('p-title').innerText = document.getElementById('f-title').value || "Название";
            document.getElementById('p-artist').innerText = (document.getElementById('f-artist').value || "АРТИСТ").toUpperCase();
            const list = document.getElementById('p-list');
            list.innerHTML = "";
            document.querySelectorAll('.link-in').forEach(i => {
                if(i.value) list.innerHTML += `<div class="p-item"><span>${i.dataset.name}</span><div class="p-btn">Слушать</div></div>`;
            });
        }

        function loadImg(e) {
            const r = new FileReader();
            r.onload = () => document.getElementById('p-img').src = r.result;
            r.readAsDataURL(e.target.files[0]);
        }

        async function publish() {
            const btn = document.querySelector('.btn-pub');
            btn.innerText = "ПУБЛИКУЮ...";
            const data = {
                slug: document.getElementById('f-slug').value,
                title: document.getElementById('f-title').value,
                artist: document.getElementById('f-artist').value,
                cover: document.getElementById('p-img').src,
                links: Array.from(document.querySelectorAll('.link-in')).map(i => ({ name: i.dataset.name, url: i.value })).filter(l => l.url)
            };

            const res = await fetch('https://foxlink-api.zajnakajsultan.workers.dev/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            if(res.ok) alert("ГОТОВО! Ссылка: /link/" + data.slug);
            else alert("ОШИБКА! Проверь консоль или GitHub.");
            btn.innerText = "ОПУБЛИКОВАТЬ";
        }
    </script>
</body>
</html>
