<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOXLINK — СМАРТЛИНКИ ДЛЯ ТЕБЯ</title>
    <style>
        /* Твой стиль: Минимализм и чистый белый */
        body { background-color: #ffffff; color: #000; font-family: 'Inter', sans-serif; margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; text-align: center; }
        
        .hero { max-width: 800px; padding: 20px; }
        
        /* Заголовок КАПСОМ */
        h1 { font-size: 48px; font-weight: 900; letter-spacing: -2px; margin-bottom: 10px; line-height: 1.1; }
        p { font-size: 18px; color: #666; margin-bottom: 40px; font-weight: 500; }

        /* Та самая кнопка регистрации */
        .btn-reg { background-color: #000; color: #fff; text-decoration: none; padding: 18px 45px; border-radius: 12px; font-size: 20px; font-weight: 800; transition: 0.3s ease; display: inline-block; border: 2px solid #000; }
        
        .btn-reg:hover { background-color: #fff; color: #000; transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }

        /* Футер или подпись */
        .footer { position: absolute; bottom: 30px; width: 100%; font-size: 12px; color: #ccc; letter-spacing: 2px; }
    </style>
</head>
<body>

    <div class="hero">
        <h1>ХОЧЕШЬ БЫСТРЫЕ СМАРТЛИНКИ?<br>ТЕБЕ К НАМ</h1>
        <p>Создавай профессиональные страницы для своих релизов за 30 секунд. Без рекламы. Без тормозов.</p>
        
        <a href="/dashboard" class="btn-reg">НАЧАТЬ СОЗДАНИЕ</a>
    </div>

    <div class="footer">
        POWERED BY FOXLINK & CLOUDFLARE
    </div>

</body>
</html>
